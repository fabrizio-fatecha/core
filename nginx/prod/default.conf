server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.fatecha.com.py$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.fatecha.com.py;

    ssl_certificate /etc/letsencrypt/live/api.fatecha.com.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fatecha.com.py/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/common.conf;
}
