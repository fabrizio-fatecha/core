name: core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/dev:/etc/nginx/conf.d:ro
      - acme:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - edge
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *default-logging

  api:
    build: .
    image: core-api:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PASSWORD: ${APP_DB_RO_PASSWORD:?APP_DB_RO_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *default-logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_RO_PASSWORD: ${APP_DB_RO_PASSWORD:?APP_DB_RO_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.9.0
    profiles:
      - tools
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    networks:
      - edge
    logging: *default-logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.77.0/24
  data:
    internal: true

volumes:
  pgdata:
  certs:
  acme:
